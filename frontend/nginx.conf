server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 110m;  # vídeos da análise de postura (até 100 MB)

    # API: mesmo endereço do site, sem CORS. O IP real do usuário segue em X-Forwarded-For (limite de login).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # arquivos com hash no nome: podem ficar em cache "para sempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # rotas do React (/financeiro, /alunos...): qualquer endereço que não é arquivo devolve o index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
